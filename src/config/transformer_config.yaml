# model.name sets the checkpoint file name, the model loaded for generation,
# and the name of the generated CSV.
model:
  type: "Transformer"
  name: "transformer_model"

runtime:
  lambda_var: 0.01
  seed: 42
  input_window: 31
  pred_window: 1
  batch_size: 256
  epochs: 50
  lr: 5.0e-4
  weight_decay: 1.0e-4
  num_workers: 2

# strategy "by_engines": cycles_per_engine rows for each of n_engines engines (null = all)
# strategy "by_samples": num_samples rows in total
# reseed_interval: single-sequence data only; insert a real window every N steps (0 disables)
generation:
  strategy: "by_engines"
  n_engines: 50
  cycles_per_engine: 30   # for single-sequence data, the total number of rows
  num_samples: 2000
  reseed_interval: 64
  
columns:
  engine_id_col_candidates: ["Engine_ID", "UnitNumber", "engine_id"]
  time_col_candidates: ["cycle", "Time", "time", "timestamp"]

io:
  data_paths:
    - "data/FD001.csv"
    # - "data/FD002.csv"
    # - "data/FD003.csv"
    # - "data/FD004.csv"
  outputs_dir: "outputs/transformer"
  checkpoint_dir: "src/model_checkPoints/transformer"

logging:
  use_tensorboard: true
  use_csv: true
  console_level: "INFO"
  file_level: "DEBUG"
  log_interval: 0
  save_plots: true
